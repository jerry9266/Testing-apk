<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title id="page-title">Download</title>

    <!-- Tailwind CSS, Font Awesome & jQuery Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://downloadwella.com/js/jquery-1.9.1.min.js"></script>

    <style>
      :root {
        --bg-dark: #07090e;
        --card-surface: #10141d;
        --divider-color: #1e2638;
        --accent-orange: #ff6a00;
        --accent-orange-active: #e05500;
      }

      body {
        background-color: var(--bg-dark);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .accent-btn {
        background-color: var(--accent-orange);
        box-shadow: 0 8px 24px -4px rgba(255, 106, 0, 0.45);
        transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      }

      .accent-btn:active {
        background-color: var(--accent-orange-active);
        transform: scale(0.98);
        box-shadow: 0 4px 16px -2px rgba(255, 106, 0, 0.4);
      }

      .poster-shadow {
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      }

      .separator {
        border-color: var(--divider-color);
      }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative px-6 pb-8">

    <!-- STICKY TOP APP BAR -->
    <header class="sticky top-0 z-50 flex items-center gap-4 py-3.5 -mx-6 px-6 bg-[#07090e]/90 backdrop-blur-md border-b border-slate-800/40">
        <button type="button" onclick="goBack()" aria-label="Go back" class="text-white hover:text-gray-300 transition text-xl p-1 focus:outline-none cursor-pointer">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 class="text-2xl font-bold tracking-tight text-white">Download</h1>
    </header>

    <!-- MAIN METADATA & POSTER CONTAINER -->
    <main class="flex-1 flex flex-col items-center justify-center my-auto w-full pt-4">

        <!-- POSTER ARTWORK / PLACEHOLDER -->
        <div class="relative w-44 h-56 rounded-2xl overflow-hidden poster-shadow mb-6 flex-shrink-0 bg-slate-800 border border-slate-700/50">
            <img 
                id="displayPoster" 
                src="" 
                alt="Poster artwork" 
                class="w-full h-full object-cover hidden"
                onload="this.classList.remove('hidden'); document.getElementById('posterPlaceholder').classList.add('hidden');"
                onerror="this.classList.add('hidden'); document.getElementById('posterPlaceholder').classList.remove('hidden');"
            >
            <!-- Fallback stylized placeholder -->
            <div id="posterPlaceholder" class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 text-slate-400">
                <i class="fa-solid fa-film text-4xl mb-2 text-slate-500"></i>
                <span class="text-xs font-semibold tracking-wider uppercase text-slate-500">Media</span>
            </div>
        </div>

        <!-- CATEGORY -->
        <p id="displayCategory" class="text-slate-400 text-sm font-medium tracking-wide mb-1 text-center truncate max-w-full">
            Loading...
        </p>

        <!-- TITLE -->
        <h2 id="displayTitle" class="text-2xl font-bold text-white text-center tracking-tight mb-1 line-clamp-2 px-2">
            Fetching details...
        </h2>

        <!-- SEASON / EPISODE OR MOVIE SUBTITLE -->
        <p id="displaySubtitle" class="text-slate-300 text-sm font-medium text-center mb-8">
            &nbsp;
        </p>

        <!-- METADATA GRID (File Size, Type, Date) -->
        <div class="w-full space-y-5 mb-2">
            
            <!-- ROW 1: File Size & Type -->
            <div class="grid grid-cols-2 gap-4 items-center">
                <!-- Size -->
                <div class="flex items-center gap-3">
                    <div class="text-slate-400 text-2xl w-8 flex justify-center">
                        <i class="fa-regular fa-file"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium">File Size</p>
                        <p id="displaySize" class="text-base font-semibold text-white tracking-tight">Checking...</p>
                    </div>
                </div>

                <!-- Type -->
                <div class="flex items-center gap-3 border-l separator pl-4">
                    <div class="text-slate-400 text-2xl w-8 flex justify-center">
                        <i class="fa-regular fa-circle-play"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Type</p>
                        <p id="displayType" class="text-base font-semibold text-white tracking-tight">MKV</p>
                    </div>
                </div>
            </div>

            <!-- HORIZONTAL SEPARATOR -->
            <hr class="separator border-t opacity-40">

            <!-- ROW 2: Date -->
            <div class="flex items-center gap-3">
                <div class="text-slate-400 text-2xl w-8 flex justify-center">
                    <i class="fa-regular fa-calendar"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-400 font-medium">Date</p>
                    <p id="displayDate" class="text-base font-semibold text-white tracking-tight">—</p>
                </div>
            </div>

        </div>

    </main>

    <!-- PROMINENT DOWNLOAD ACTION (ORANGE) & FORM SUBMISSION -->
    <footer class="w-full pt-6">
        <form name="F1" id="download-form" method="POST" action="https://downloadwella.com/">
            <input type="hidden" name="op" value="download2">
            <input type="hidden" name="id" id="form-file-id" value="">
            <input type="hidden" name="rand" value="">
            <input type="hidden" name="referer" id="form-referer" value="">
            <input type="hidden" name="method_free" value="">
            <input type="hidden" name="method_premium" value="">

            <button 
                type="button" 
                id="downloadbtn" 
                class="accent-btn w-full py-4 rounded-full text-white text-base font-semibold flex items-center justify-center gap-3 focus:outline-none cursor-pointer"
            >
                <i class="fa-solid fa-arrow-down text-lg"></i>
                <span>Download</span>
            </button>
        </form>
    </footer>

    <!-- Dynamic File ID, Metadata Parsing & Submission Logic -->
    <script type="text/javascript">
        const BASE_HOST = "https://downloadwella.com";

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "/";
            }
        }

        function formatDisplayDate(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) {
                dateObj = new Date();
            }
            const day = String(dateObj.getDate()).padStart(2, '0');
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const mon = months[dateObj.getMonth()];
            const year = dateObj.getFullYear();
            return `${day} ${mon} ${year}`;
        }

        function resolveFileId() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('id')) return params.get('id');
            if (params.has('code')) return params.get('code');
            if (params.has('file')) return params.get('file');

            if (params.has('url')) {
                const match = params.get('url').match(/downloadwella\.com\/([a-zA-Z0-9]+)/);
                if (match && match[1]) return match[1];
            }

            const pathMatch = window.location.pathname.match(/\/([a-zA-Z0-9]{6,20})/);
            if (pathMatch && pathMatch[1]) return pathMatch[1];

            return $('#form-file-id').val() || "";
        }

        function parseMediaMetadata(rawFileName, explicitCategory) {
            let filename = String(rawFileName || "").trim();

            let category = explicitCategory || "Movies";
            if (!explicitCategory) {
                if (/korean/i.test(filename)) category = "Korean Series";
                else if (/season|s\d+/i.test(filename)) category = "TV Series";
            }

            // Extract Type
            let fileType = "MKV";
            const extMatch = filename.match(/\.(mkv|mp4|avi|mov|wmv|webm|flv|m4v)$/i);
            if (extMatch) {
                fileType = extMatch[1].toUpperCase();
            }

            // Detect Season & Episode
            let season = null;
            let episode = null;
            const seMatch = filename.match(/(?:s|season)[._\s-]*(\d+)[._\s-]*(?:e|ep|episode)[._\s-]*(\d+)/i) ||
                            filename.match(/(\d+)x(\d+)/i);
            const sOnlyMatch = filename.match(/(?:s|season)[._\s-]*(\d+)/i);

            if (seMatch) {
                season = parseInt(seMatch[1], 10);
                episode = parseInt(seMatch[2], 10);
            } else if (sOnlyMatch) {
                season = parseInt(sOnlyMatch[1], 10);
            }

            // Clean Title
            let titleClean = filename.replace(/\.(mkv|mp4|avi|mov|wmv|webm|flv|m4v)$/i, '');
            const noise = [
                /(?:s|season)[._\s-]*\d+[._\s-]*(?:e|ep|episode)[._\s-]*\d+/gi,
                /(?:s|season)[._\s-]*\d+/gi,
                /\b(?:2160p|1080p|720p|480p|360p|4k|uhd|hd|sd)\b/gi,
                /\b(?:web-?dl|webrip|bluray|bdrip|brrip|dvdrip|hdrip|camrip|hdtv)\b/gi,
                /\b(?:x264|x265|h264|h265|hevc|avc|xvid|divx|10bit)\b/gi,
                /\b(?:aac(?:\d\.\d)?|ac3|dts|mp3|ddp\d\.\d|dual-audio|atmos)\b/gi,
                /\b(?:fztvseries(?:\.ng)?|fzmovies(?:\.net)?|o2tvseries|netnaija|loadedfiles|downloadwella)\b/gi,
                /\[.*?\]|\(.*?\)/g
            ];

            noise.forEach(re => { titleClean = titleClean.replace(re, ' '); });
            titleClean = titleClean.replace(/[._\-]+/g, ' ').replace(/\s+/g, ' ').trim();
            titleClean = titleClean.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

            if (!titleClean) titleClean = "Selected Video";

            let subtitle = "";
            if (season !== null && episode !== null) {
                subtitle = `Season ${season}  •  Episode ${episode}`;
            } else if (season !== null) {
                subtitle = `Season ${season}`;
            } else {
                subtitle = "Movie";
            }

            return { category, title: titleClean, subtitle, fileType };
        }

        function populateMetadata() {
            const params = new URLSearchParams(window.location.search);

            const rawName = params.get('name') || localStorage.getItem('downloadwellaVideoTitle') || "Movie";
            const explicitSize = params.get('size') || localStorage.getItem('downloadwellaVideoSize') || "";
            const explicitType = params.get('type') || localStorage.getItem('downloadwellaVideoType') || "";
            const explicitPoster = params.get('poster') || localStorage.getItem('downloadwellaVideoPoster') || localStorage.getItem('widesharesVideoPoster') || "";
            const explicitDate = params.get('date') || localStorage.getItem('downloadwellaVideoDate') || "";

            const meta = parseMediaMetadata(rawName);

            // Populate poster
            if (explicitPoster) {
                $('#displayPoster').attr('src', explicitPoster);
            }

            // Populate text elements
            $('#displayCategory').text(meta.category);
            $('#displayTitle').text(meta.title);
            $('#displaySubtitle').text(meta.subtitle);
            $('#page-title').text(`${meta.title} • Download`);

            // Size
            if (explicitSize && !explicitSize.toLowerCase().includes('direct stream')) {
                $('#displaySize').text(explicitSize.startsWith('~') ? explicitSize : `~ ${explicitSize}`);
            } else {
                $('#displaySize').text("Ready (Full)");
            }

            // Type
            $('#displayType').text(explicitType ? explicitType.toUpperCase() : meta.fileType);

            // Date
            if (explicitDate) {
                const parsedDate = new Date(explicitDate);
                $('#displayDate').text(!isNaN(parsedDate.getTime()) ? formatDisplayDate(parsedDate) : explicitDate);
            } else {
                $('#displayDate').text(formatDisplayDate(new Date()));
            }
        }

        $(document).ready(function () {
            const fileId = resolveFileId();
            
            // Populate dynamic attributes
            $('#form-file-id').val(fileId);
            $('#form-referer').val(document.referrer || window.location.href);

            // Set the direct backend target URL
            if (fileId) {
                $('#download-form').attr('action', BASE_HOST + "/" + fileId);
            }

            populateMetadata();

            // Submit handler directly to DownloadWella backend
            $('#downloadbtn').click(function () {
                const currentId = $('#form-file-id').val() || resolveFileId();
                const form = document.getElementById('download-form');
                if (currentId) {
                    form.action = BASE_HOST + "/" + currentId;
                }
                form.submit();
            });
        });
    </script>
</body>
</html>
