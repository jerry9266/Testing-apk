<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Download</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg-dark: #07090e;
    --card-surface: #10141d;
    --divider-color: #1e2638;
    --accent-orange: #ff6a00;
    --accent-orange-active: #e05500;
  }

  body {
    background-color: var(--bg-dark);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .accent-btn {
    background-color: var(--accent-orange);
    box-shadow: 0 8px 24px -4px rgba(255, 106, 0, 0.45);
    transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }

  .accent-btn:active {
    background-color: var(--accent-orange-active);
    transform: scale(0.98);
    box-shadow: 0 4px 16px -2px rgba(255, 106, 0, 0.4);
  }

  .poster-shadow {
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  }

  .separator {
    border-color: var(--divider-color);
  }
</style>
</head>

<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative px-6 pb-8">

  <!-- STICKY TOP APP BAR -->
  <header class="sticky top-0 z-50 flex items-center gap-4 py-3.5 -mx-6 px-6 bg-[#07090e]/90 backdrop-blur-md border-b border-slate-800/40">
    <button type="button" onclick="handleBack()" aria-label="Go back" class="text-white hover:text-gray-300 transition text-xl p-1 focus:outline-none cursor-pointer">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1 class="text-2xl font-bold tracking-tight text-white">Download</h1>
  </header>

  <!-- MAIN METADATA & POSTER CONTAINER -->
  <main class="flex-1 flex flex-col items-center justify-center my-auto w-full pt-4">

    <!-- POSTER ARTWORK / PLACEHOLDER -->
    <div class="relative w-44 h-56 rounded-2xl overflow-hidden poster-shadow mb-6 flex-shrink-0 bg-slate-800 border border-slate-700/50">
      <img 
        id="displayPoster" 
        src="" 
        alt="Poster artwork" 
        class="w-full h-full object-cover hidden"
        onload="this.classList.remove('hidden'); document.getElementById('posterPlaceholder').classList.add('hidden');"
        onerror="this.classList.add('hidden'); document.getElementById('posterPlaceholder').classList.remove('hidden');"
      >
      <!-- Fallback stylized placeholder when no artwork URL exists -->
      <div id="posterPlaceholder" class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 text-slate-400">
        <i class="fa-solid fa-film text-4xl mb-2 text-slate-500"></i>
        <span class="text-xs font-semibold tracking-wider uppercase text-slate-500">Media</span>
      </div>
    </div>

    <!-- CATEGORY -->
    <p id="displayCategory" class="text-slate-400 text-sm font-medium tracking-wide mb-1 text-center truncate max-w-full">
      Loading...
    </p>

    <!-- TITLE -->
    <h2 id="displayTitle" class="text-2xl font-bold text-white text-center tracking-tight mb-1 line-clamp-2 px-2">
      Fetching details...
    </h2>

    <!-- SEASON / EPISODE OR MOVIE SUBTITLE -->
    <p id="displaySubtitle" class="text-slate-300 text-sm font-medium text-center mb-8">
      &nbsp;
    </p>

    <!-- METADATA GRID (File Size, Type, Date) -->
    <div class="w-full space-y-5 mb-2">
      
      <!-- ROW 1: File Size & Type -->
      <div class="grid grid-cols-2 gap-4 items-center">
        <!-- Size -->
        <div class="flex items-center gap-3">
          <div class="text-slate-400 text-2xl w-8 flex justify-center">
            <i class="fa-regular fa-file"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">File Size</p>
            <p id="displaySize" class="text-base font-semibold text-white tracking-tight">Checking...</p>
          </div>
        </div>

        <!-- Type -->
        <div class="flex items-center gap-3 border-l separator pl-4">
          <div class="text-slate-400 text-2xl w-8 flex justify-center">
            <i class="fa-regular fa-circle-play"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">Type</p>
            <p id="displayType" class="text-base font-semibold text-white tracking-tight">MKV</p>
          </div>
        </div>
      </div>

      <!-- HORIZONTAL SEPARATOR -->
      <hr class="separator border-t opacity-40">

      <!-- ROW 2: Date -->
      <div class="flex items-center gap-3">
        <div class="text-slate-400 text-2xl w-8 flex justify-center">
          <i class="fa-regular fa-calendar"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 font-medium">Date</p>
          <p id="displayDate" class="text-base font-semibold text-white tracking-tight">—</p>
        </div>
      </div>

    </div>

  </main>

  <!-- PROMINENT DOWNLOAD ACTION (ORANGE) -->
  <footer class="w-full pt-6">
    <button 
      type="button" 
      id="downloadButton"
      onclick="startDownload()" 
      class="accent-btn w-full py-4 rounded-full text-white text-base font-semibold flex items-center justify-center gap-3 focus:outline-none cursor-pointer"
    >
      <i class="fa-solid fa-arrow-down text-lg"></i>
      <span>Download</span>
    </button>
  </footer>

  <script>
    // Pure internal download URL holder. Never injected into UI text elements.
    let currentDownloadUrl = "";

    // 1. Navigation helper
    function handleBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    // 2. Format byte counts
    function formatBytes(bytes) {
      if (!bytes || isNaN(bytes) || bytes <= 0) return null;
      const units = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.floor(Math.log(bytes) / Math.log(1024));
      const val = (bytes / Math.pow(1024, index)).toFixed(index >= 2 ? 1 : 0);
      return `~ ${val} ${units[index]}`;
    }

    // 3. Format Date strictly as "DD Mon YYYY" (e.g., 08 Oct 2026)
    function formatDisplayDate(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) {
        dateObj = new Date();
      }
      const day = String(dateObj.getDate()).padStart(2, '0');
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const mon = months[dateObj.getMonth()];
      const year = dateObj.getFullYear();
      return `${day} ${mon} ${year}`;
    }

    // 4. Intelligent metadata extractor & cleaner
    function parseMediaMetadata(inputPath) {
      let raw = String(inputPath || "").trim();
      let extractedPath = "";

      // Unpack from query string if present
      if (raw.includes("path=")) {
        try {
          const urlObj = new URL(raw.startsWith("http") ? raw : "https://placeholder.local/" + raw);
          extractedPath = urlObj.searchParams.get("path") || "";
        } catch (e) {
          const m = raw.match(/path=([^&]+)/);
          if (m) extractedPath = decodeURIComponent(m[1]);
        }
      } else {
        extractedPath = raw;
      }

      // Standardize and decode path
      try {
        extractedPath = decodeURIComponent(extractedPath);
      } catch (e) {}

      // Split directories
      const segments = extractedPath.replace(/\\/g, '/').split('/').filter(Boolean);
      const rawFileName = segments.length > 0 ? segments[segments.length - 1] : "";
      const rawCategory = segments.length > 1 ? segments[0] : "";

      // 4A. Clean Category
      let category = "Media";
      if (rawCategory) {
        category = rawCategory
          .replace(/[+_.-]+/g, ' ')
          .trim()
          .toLowerCase()
          .replace(/\b\w/g, c => c.toUpperCase());
      } else {
        category = "Movies";
      }

      // 4B. Extract Extension / Type
      let fileType = "MKV";
      const extMatch = rawFileName.match(/\.(mkv|mp4|avi|mov|wmv|webm|flv|m4v)$/i);
      if (extMatch) {
        fileType = extMatch[1].toUpperCase();
      }

      // 4C. Detect Season & Episode patterns
      let season = null;
      let episode = null;

      const seMatch = rawFileName.match(/(?:s|season)[._\s-]*(\d+)[._\s-]*(?:e|ep|episode)[._\s-]*(\d+)/i) ||
                      rawFileName.match(/(\d+)x(\d+)/i);
      const sOnlyMatch = rawFileName.match(/(?:s|season)[._\s-]*(\d+)/i);

      if (seMatch) {
        season = parseInt(seMatch[1], 10);
        episode = parseInt(seMatch[2], 10);
      } else if (sOnlyMatch) {
        season = parseInt(sOnlyMatch[1], 10);
      }

      // 4D. Clean Title
      let titleClean = rawFileName.replace(/\.(mkv|mp4|avi|mov|wmv|webm|flv|m4v)$/i, '');

      // Known noise and release tags
      const noisePatterns = [
        /(?:s|season)[._\s-]*\d+[._\s-]*(?:e|ep|episode)[._\s-]*\d+/gi,
        /(?:s|season)[._\s-]*\d+/gi,
        /\b(?:2160p|1080p|720p|480p|360p|4k|uhd|hd|sd)\b/gi,
        /\b(?:web-?dl|webrip|bluray|bdrip|brrip|dvdrip|hdrip|camrip|hdtv)\b/gi,
        /\b(?:x264|x265|h264|h265|hevc|avc|xvid|divx|10bit)\b/gi,
        /\b(?:aac(?:\d\.\d)?|ac3|dts|mp3|ddp\d\.\d|dual-audio|atmos)\b/gi,
        /\b(?:fztvseries(?:\.ng)?|fzmovies(?:\.net)?|o2tvseries|netnaija|loadedfiles)\b/gi,
        /\[.*?\]|\(.*?\)/g
      ];

      noisePatterns.forEach(regex => {
        titleClean = titleClean.replace(regex, ' ');
      });

      titleClean = titleClean.replace(/[._\-]+/g, ' ').replace(/\s+/g, ' ').trim();
      titleClean = titleClean
        .toLowerCase()
        .replace(/\b\w/g, char => char.toUpperCase());

      if (!titleClean) {
        titleClean = "Selected Video";
      }

      // 4E. Subtitle Logic (Season/Episode vs Movie)
      let subtitle = "";
      if (season !== null && episode !== null) {
        subtitle = `Season ${season}  •  Episode ${episode}`;
      } else if (season !== null) {
        subtitle = `Season ${season}`;
      } else {
        subtitle = "Movie";
      }

      return {
        category,
        title: titleClean,
        subtitle,
        fileType,
        originalFile: rawFileName
      };
    }

    // 5. Build dynamic internal download link
    function resolveInternalDownloadUrl(videoId) {
      const raw = String(videoId || "").trim();
      if (!raw) return "";

      if (raw.startsWith("http://") || raw.startsWith("https://")) {
        return raw;
      }
      if (raw.includes("force_download.php")) {
        return raw.startsWith("/") ? `https://wideshares.org${raw}` : `https://wideshares.org/${raw}`;
      }
      if (/^[a-zA-Z0-9_-]+$/.test(raw) && !raw.includes("/")) {
        return `https://wideshares.org/download/${encodeURIComponent(raw)}`;
      }
      
      let cleanPath = raw.startsWith("/") ? raw : "/" + raw;
      return `https://wideshares.org/force_download.php?path=${encodeURIComponent(cleanPath)}`;
    }

    // 6. Populate and display video data
    async function initMediaDetails() {
      const rawVideoId = localStorage.getItem('widesharesVideoId') || "";
      const storedTitle = localStorage.getItem('widesharesVideoTitle') || "";
      const storedSize = localStorage.getItem('widesharesVideoSize') || "";
      const storedPoster = localStorage.getItem('widesharesVideoPoster') || "";

      if (!rawVideoId && !storedTitle) {
        document.getElementById('displayTitle').textContent = "No Media Selected";
        document.getElementById('displayCategory').textContent = "Not Found";
        document.getElementById('displaySubtitle').textContent = "";
        document.getElementById('displaySize').textContent = "—";
        document.getElementById('displayDate').textContent = formatDisplayDate(new Date());
        return;
      }

      currentDownloadUrl = resolveInternalDownloadUrl(rawVideoId);

      const metadataSource = rawVideoId || storedTitle;
      const meta = parseMediaMetadata(metadataSource);

      document.getElementById('displayCategory').textContent = meta.category;
      document.getElementById('displayTitle').textContent = meta.title;
      document.getElementById('displaySubtitle').textContent = meta.subtitle;
      document.getElementById('displayType').textContent = meta.fileType;
      document.title = `${meta.title} • Download`;

      if (storedPoster) {
        const posterEl = document.getElementById('displayPoster');
        posterEl.src = storedPoster;
      }

      document.getElementById('displayDate').textContent = formatDisplayDate(new Date());

      const sizeEl = document.getElementById('displaySize');
      if (storedSize && !storedSize.toLowerCase().includes("direct stream")) {
        sizeEl.textContent = storedSize.startsWith("~") ? storedSize : `~ ${storedSize}`;
      } else {
        sizeEl.textContent = "Checking...";
      }

      if (currentDownloadUrl) {
        try {
          const res = await fetch(currentDownloadUrl, { method: 'HEAD' });
          if (res.ok) {
            const lengthHeader = res.headers.get('content-length');
            if (lengthHeader) {
              const formatted = formatBytes(parseInt(lengthHeader, 10));
              if (formatted) sizeEl.textContent = formatted;
            } else if (!storedSize || storedSize.toLowerCase().includes("direct stream")) {
              sizeEl.textContent = "Ready (Full)";
            }

            const modHeader = res.headers.get('last-modified');
            if (modHeader) {
              document.getElementById('displayDate').textContent = formatDisplayDate(new Date(modHeader));
            }
          } else {
            if (!storedSize || storedSize.toLowerCase().includes("direct stream")) {
              sizeEl.textContent = "Ready (Full)";
            }
          }
        } catch (e) {
          if (!storedSize || storedSize.toLowerCase().includes("direct stream")) {
            sizeEl.textContent = "Ready (Full)";
          }
        }
      }
    }

    // 7. Trigger file download safely
    function startDownload() {
      if (!currentDownloadUrl) {
        alert("The download link is not available. Please return and select the item again.");
        return;
      }
      const anchor = document.createElement('a');
      anchor.href = currentDownloadUrl;
      anchor.setAttribute('download', '');
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', initMediaDetails);
  </script>
</body>
</html>
