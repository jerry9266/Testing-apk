<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APK Notification Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    p {
      margin: 0 0 20px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f1f1f1;
      color: #555;
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>APK Notification Test</h2>

    <p>
      Type a message below and press Send.
      The HTML will ask the Android APK to create a native notification.
    </p>

    <textarea id="message" placeholder="Type your notification message..."></textarea>

    <button onclick="sendNotification()">
      Send Notification
    </button>

    <div id="status"></div>
  </div>

  <script>
    function sendNotification() {
      const messageInput = document.getElementById("message");
      const status = document.getElementById("status");

      const message = messageInput.value.trim();

      if (!message) {
        showStatus("Please type a message first.");
        return;
      }

      /*
       * Check whether the Android APK has exposed
       * a JavaScript bridge called "Android".
       */
      if (window.Android && typeof window.Android.notify === "function") {

        /*
         * Send the notification to the native Android APK.
         */
        window.Android.notify(
          "New Notification",
          message
        );

        showStatus("Notification sent to the APK.");

      } else {

        /*
         * This means the HTML is running without
         * the required Android JavaScript bridge.
         */
        showStatus(
          "Android notification bridge was not found. " +
          "Make sure the APK exposes Android.notify()."
        );
      }

      messageInput.value = "";
    }

    function showStatus(text) {
      const status = document.getElementById("status");

      status.textContent = text;
      status.style.display = "block";

      setTimeout(() => {
        status.style.display = "none";
      }, 4000);
    }
  </script>

</body>
</html>
