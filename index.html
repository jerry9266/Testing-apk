<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading App...</title>
    
    <!-- Fallback redirect just in case JavaScript takes a moment to execute -->
    <meta http-equiv="refresh" content="0; url=https://leo-bq9n.onrender.com">

    <style>
        /* CSS to center a simple loading message */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* You can change this to match your app's theme color */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .loading-container {
            text-align: center;
            color: #333333;
        }

        /* Optional: A simple CSS loading spinner */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff; /* Blue color, change if needed */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loading-container">
        <div class="spinner"></div>
        <h2>Loading...</h2>
    </div>

    <script>
        // JavaScript function to redirect to your hardcoded link
        function loadWebApp() {
            const hardcodedLink = "https://leo-bq9n.onrender.com";
            
            // .replace() is used so the local HTML file isn't saved in the WebView's back history
            window.location.replace(hardcodedLink);
        }

        // Run the function as soon as the window loads
        window.onload = function() {
            loadWebApp();
        };
    </script>

</body>
</html>
